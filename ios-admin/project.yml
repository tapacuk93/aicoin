# AICoin Admin - the operator's controls for aicoin-proxy, on the phone.
# xcodegen generate, then build; see README.md for installing on a device.
name: AICoinAdmin
options:
  bundleIdPrefix: com.tarasmaslov
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: HTS38ZPRVH
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AICoinAdmin:
    type: application
    platform: iOS
    sources: [AICoinAdmin]
    info:
      path: AICoinAdmin/Info.plist
      properties:
        CFBundleDisplayName: AICoin Admin
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [remote-notification]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tarasmaslov.aicoinadmin
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        # Push alerts from the proxy. "development" for the dev install; an App Store or
        # TestFlight export rewrites it to production from its distribution profile.
        CODE_SIGN_ENTITLEMENTS: AICoinAdmin/AICoinAdmin.entitlements
