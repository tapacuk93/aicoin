services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1000"]
    ports:
      - "6379:6379"

  aicoin-proxy:
    build: ./aicoin-proxy
    environment:
      AICOIN_PROXY_PORT: "8080"
      AICOIN_PROXY_REDIS_HOST: "redis"
      AICOIN_PROXY_REDIS_PORT: "6379"
    ports:
      - "8080:8080"
    depends_on:
      - redis
