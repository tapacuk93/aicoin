name: AICoinWallet
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "HTS38ZPRVH"
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: YES

targets:
  AICoinWallet:
    type: application
    platform: iOS
    sources:
      - path: AICoinWallet
    # An explicit plist rather than GENERATE_INFOPLIST_FILE: the branded launch
    # screen needs a UILaunchScreen dictionary, and no INFOPLIST_KEY_ build
    # setting can express UIImageName/UIColorName.
    info:
      path: AICoinWallet/Info.plist
      properties:
        CFBundleDisplayName: AICoin Wallet
        # From the build settings, so an upload can set its own build number.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Required on the Mac App Store.
        LSApplicationCategoryType: public.app-category.finance
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        # iPhone stays portrait-only. iPad must offer all four or the App Store
        # rejects the build (error 90474 — iPad multitasking), and this target
        # is universal via TARGETED_DEVICE_FAMILY "1,2".
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Ed25519 signing + HTTPS only — exempt, so uploads skip the
        # export-compliance prompt.
        ITSAppUsesNonExemptEncryption: false
        # Without it, iOS terminates the app the moment the QR scanner opens the camera.
        NSCameraUsageDescription: "Scan a wallet address to pay it, or a service's code to let it make AI calls billed to this wallet."
    entitlements:
      path: AICoinWallet/AICoinWallet.entitlements
      properties:
        # The seed lives in this group, synchronizable, so iCloud Keychain
        # carries it to the user's other devices (see KeychainStore).
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.oeaio.aicoin.wallet
        # Mac App Store: sandboxed, talks to the proxy, scans QR codes.
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.device.camera: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oeaio.aicoin.wallet
        # The Mac app is this target under Mac Catalyst, keeping the iOS
        # bundle ID: one universal purchase, and the same keychain access
        # group, so the wallet synced through iCloud Keychain opens on both.
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  AICoinWalletTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AICoinWalletTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oeaio.aicoin.wallet.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AICoinWallet

  AICoinWalletUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AICoinWalletUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oeaio.aicoin.wallet.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AICoinWallet

schemes:
  AICoinWallet:
    build:
      targets:
        AICoinWallet: all
    test:
      targets:
        - AICoinWalletTests
        - AICoinWalletUITests
    run:
      config: Debug
