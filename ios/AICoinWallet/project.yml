name: AICoinWallet
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: YES

targets:
  AICoinWallet:
    type: application
    platform: iOS
    sources:
      - path: AICoinWallet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oeaio.aicoin.wallet
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: AICoin Wallet
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        GENERATE_INFOPLIST_FILE: YES

  AICoinWalletTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AICoinWalletTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oeaio.aicoin.wallet.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AICoinWallet

  AICoinWalletUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AICoinWalletUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oeaio.aicoin.wallet.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AICoinWallet

schemes:
  AICoinWallet:
    build:
      targets:
        AICoinWallet: all
    test:
      targets:
        - AICoinWalletTests
        - AICoinWalletUITests
    run:
      config: Debug
