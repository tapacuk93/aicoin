server:
  port: 8080
redis:
  host: localhost
  port: 6379
  username: ""
  password: ""
  ssl: false
aicoin:
  decayHalflifeDays: 110.0
  freeClaimCooldownSeconds: 3600
  signatureSkewSeconds: 120
  freeCoinsPoolSize: 5000
  adminToken: ""
# freePaths: endpoints the provider does not bill the proxy for. A matching call is
# forwarded (with the proxy's key, after the usual token auth) but costs no aicoin and
# records no price event. Syntax: "[METHOD ]path-glob", where * matches any characters.
providers:
  openai:
    baseUrl: https://api.openai.com
    apiKey: ""
    authHeader: Authorization
    authPrefix: "Bearer "
    freePaths: ["GET /v1/models", "GET /v1/models/*"]
  anthropic:
    baseUrl: https://api.anthropic.com
    apiKey: ""
    authHeader: x-api-key
    authPrefix: ""
    freePaths: ["GET /v1/models", "GET /v1/models/*", "POST /v1/messages/count_tokens"]
  google:
    baseUrl: https://generativelanguage.googleapis.com
    apiKey: ""
    authAsQueryParam: true
    authQueryParamName: key
    freePaths: ["GET /v1/models", "GET /v1/models/*", "GET /v1beta/models", "GET /v1beta/models/*",
                "POST /v1/models/*:countTokens", "POST /v1beta/models/*:countTokens"]
  mistral:
    baseUrl: https://api.mistral.ai
    apiKey: ""
    authHeader: Authorization
    authPrefix: "Bearer "
    freePaths: ["GET /v1/models", "GET /v1/models/*"]
  cohere:
    baseUrl: https://api.cohere.ai
    apiKey: ""
    authHeader: Authorization
    authPrefix: "Bearer "
    freePaths: ["GET /v1/models", "GET /v1/models/*", "POST /v1/tokenize", "POST /v1/detokenize",
                "POST /v1/check-api-key"]
  elevenlabs:
    baseUrl: https://api.elevenlabs.io
    apiKey: ""
    authHeader: xi-api-key
    authPrefix: ""
    freePaths: ["GET /v1/models", "GET /v1/voices", "GET /v1/voices/*", "GET /v1/user", "GET /v1/user/subscription"]
  stability:
    baseUrl: https://api.stability.ai
    apiKey: ""
    authHeader: Authorization
    authPrefix: "Bearer "
    freePaths: ["GET /v1/engines/list", "GET /v1/user/account", "GET /v1/user/balance"]
  # Moonshot's Kimi, spoken to on its OpenAI-compatible surface. api.moonshot.ai is still the
  # API host even though the platform docs now live at kimi.ai.
  kimi:
    baseUrl: https://api.moonshot.ai
    apiKey: ""
    authHeader: Authorization
    authPrefix: "Bearer "
    freePaths: ["GET /v1/models", "GET /v1/models/*"]
pricing:
  # Charge each call what it actually cost, rounded up to whole coins with a floor of one,
  # instead of a flat coin per call. This is the billing model — the flag exists so it can be
  # turned OFF (per deployment, or for a test run) rather than as an opt-in.
  #
  # Turning it off again is a user-visible pricing change in the other direction: every client's
  # copy says a call costs "from 1 AICoin, more if it's a long one", so a deployment that flips
  # this to false is charging less than it says, not more. Harmless to users, but don't leave it
  # there by accident. Env: AICOIN_PROXY_METERED.
  metered: true
  # What one coin is worth when metering. Defaults to the per-coin price of the largest IAP pack
  # — the cheapest a coin is ever sold for — so metering against it never under-charges a bulk
  # buyer. Env: AICOIN_PROXY_COIN_VALUE_USD.
  coinValueUsd: 0.009
  # Fallbacks only, for a provider or model with no entry under `providers` below.
  costPerTokenUsd: 0.000002
  defaultCostUsdPerCall: 0.001
  # Per-provider, per-model list prices in USD per million tokens. One blended rate cannot be
  # right for more than one model at a time — Sonnet bills output at 5x its input rate, Haiku at
  # a third of Sonnet's, and speech and image APIs report no tokens at all. Nor can one rate fit
  # every client: input/output ratios differ sharply between chat, long-context, and generation
  # workloads, and this proxy serves all of them. Longest matching model prefix wins, then the
  # provider's own input/output rates, then `usdPerCall`, then the fallbacks above. Rates are
  # config, not code: correct them here when a provider reprices.
  providers:
    anthropic:
      inputUsdPerMillionTokens: 3.00
      outputUsdPerMillionTokens: 15.00
      models:
        # Sonnet 5 also has introductory pricing of 2.00/10.00 running to 2026-08-31; the standard
        # rate is used here deliberately, since under-recording cost is the failure this table
        # exists to prevent and the introductory rate lapses shortly.
        claude-sonnet-5:  { inputUsdPerMillionTokens: 3.00, outputUsdPerMillionTokens: 15.00 }
        claude-haiku-4-5: { inputUsdPerMillionTokens: 1.00, outputUsdPerMillionTokens: 5.00 }
        claude-opus-5:    { inputUsdPerMillionTokens: 5.00, outputUsdPerMillionTokens: 25.00 }
    # Non-Anthropic rates below are unverified starting points — check each provider's own pricing
    # page and correct them here.
    openai:
      inputUsdPerMillionTokens: 2.50
      outputUsdPerMillionTokens: 10.00
      models:
        # The consortium's default OpenAI panelist. Named here because the provider default above
        # is dearer on input than GPT-5 actually is, and a rate this proxy gets wrong in either
        # direction ends up in GET /price.
        gpt-5: { inputUsdPerMillionTokens: 1.25, outputUsdPerMillionTokens: 10.00 }
    google:
      inputUsdPerMillionTokens: 0.30
      outputUsdPerMillionTokens: 2.50
      models:
        # The consortium's default Google panelist, at five times the provider default's input
        # rate. Without this line every consortium call through Gemini would be recorded at a
        # fraction of what it cost.
        gemini-3.5-flash: { inputUsdPerMillionTokens: 1.50, outputUsdPerMillionTokens: 9.00 }
        # Billed per image, not by the tokens the response happens to report. Left here as well as
        # in the built-in defaults so the figure can be corrected without a release when Google
        # moves it.
        gemini-2.5-flash-image: { usdPerCall: 0.039 }
        gemini-2.0-flash-preview-image-generation: { usdPerCall: 0.039 }
    # Kimi K2.6 and K2.7 Code share a rate; the high-speed K2.7 Code doubles the output rate, and
    # its longer id wins the prefix match. The provider default is K3's rate — the dearest — so an
    # unlisted model is over-recorded rather than under-recorded.
    kimi:
      inputUsdPerMillionTokens: 3.00
      outputUsdPerMillionTokens: 15.00
      models:
        kimi-k3:                    { inputUsdPerMillionTokens: 3.00, outputUsdPerMillionTokens: 15.00 }
        kimi-k2.7-code-highspeed:   { inputUsdPerMillionTokens: 0.95, outputUsdPerMillionTokens: 8.00 }
        kimi-k2.7-code:             { inputUsdPerMillionTokens: 0.95, outputUsdPerMillionTokens: 4.00 }
        kimi-k2.6:                  { inputUsdPerMillionTokens: 0.95, outputUsdPerMillionTokens: 4.00 }
    # Billed per character and per image respectively, and neither reports token usage, so both
    # get a flat per-call figure instead of token rates.
    elevenlabs:
      usdPerCall: 0.03
    stability:
      usdPerCall: 0.03
# One request answered by every configured AI at once, merged, then reviewed by all of them until
# a whole round comes back with no comments. See CONTRACT.md's "Consortium" section; every turn is
# an ordinary paid call, so the round cap is also a spend cap.
consortium:
  # Env: AICOIN_PROXY_CONSORTIUM_ENABLED. Off serves 404, as if the endpoint did not exist.
  enabled: true
  # The most review rounds one call may run before it returns what it has. Reviewers asked to find
  # fault can always find some, so this — not agreement — is what guarantees the call ends.
  # Env: AICOIN_PROXY_CONSORTIUM_MAX_ROUNDS.
  maxRounds: 3
  # Output cap per turn. Generous because the reasoning models on this panel spend part of it
  # thinking, and a turn that runs out mid-thought comes back with no text at all.
  # Env: AICOIN_PROXY_CONSORTIUM_MAX_OUTPUT_TOKENS.
  maxOutputTokens: 4000
  # How much of the panel's shared record one turn may be given. Every panelist sees the record on
  # every turn, so this is multiplied by the panel size and by the rounds, and every character is
  # billed as input. Past it the oldest rounds are dropped; the request, the caller's background and
  # the current answer never are. Env: AICOIN_PROXY_CONSORTIUM_MAX_CONTEXT_CHARS.
  maxContextChars: 60000
  # Above this much caller-supplied context, `mode: auto` stops drafting in parallel and runs the
  # call led by one model, with the rest improving its answer round by round. Several models
  # answering the same short question independently disagree in useful ways and the merge is where
  # that pays off; once a directory or a document comes with the request, every draft is mostly a
  # re-reading of the same material, billed once per panelist, and they converge anyway because the
  # context is doing the work. Env: AICOIN_PROXY_CONSORTIUM_LEAD_CONTEXT_CHARS.
  leadContextChars: 8000
  # Who merges the drafts and applies the comments. Empty means the first panelist.
  # Env: AICOIN_PROXY_CONSORTIUM_EDITOR.
  editor: ""
  # What each panelist answers with. Config, not code: providers rename and retire models on their
  # own schedule, and a consortium that 400s because an id lapsed should be a restart away from
  # working. Env: AICOIN_PROXY_CONSORTIUM_<PROVIDER>_MODEL.
  models:
    anthropic: claude-sonnet-5
    openai: gpt-5
    google: gemini-3.5-flash
    mistral: mistral-large-latest
    kimi: kimi-k2.6
health:
  windowSize: 50
upstream:
  # How long a provider connection may deliver nothing before the forward is abandoned as a 504
  # and the call's coins are refunded. The connect timeout covers only establishing the socket, so
  # without this a provider that accepted and then stalled was waited on indefinitely — the
  # client's own timeout was the only limit anywhere, and it left this side holding the socket, the
  # buffered response and an unrefunded debit. Generous enough for a long speech synthesis or a
  # large completion, far below the point where any client is still listening.
  # Env: AICOIN_PROXY_UPSTREAM_READ_TIMEOUT_SECONDS.
  readTimeoutSeconds: 60
accessLog:
  # One JSON line per request: method, path (no query — see AccessLog on why credentials are never
  # written), provider, wallet address, status, byte counts, duration, coins charged, outcome.
  # A client that gives up and disconnects before any response is recorded as status -1 /
  # "client_gone", which is the only trace such a request leaves anywhere.
  # Empty path turns access logging off. Env: AICOIN_PROXY_ACCESS_LOG_PATH.
  path: logs/access.log
  # Rotation is by size: maxBytes per file, count files kept, oldest overwritten. maxBytes × count
  # is a hard ceiling on disk used — this shares a 20GB Lightsail volume with Redis snapshots, so
  # the default deliberately caps the whole log at 50MB.
  # Env: AICOIN_PROXY_ACCESS_LOG_MAX_BYTES / AICOIN_PROXY_ACCESS_LOG_COUNT.
  maxBytes: 10485760
  count: 5
iap:
  # Whether POST /wallet/api/redeem-iap honours StoreKit *Sandbox* transactions. Production must
  # leave this false: Apple signs sandbox transactions with the same certificate chain as real
  # ones, so they verify identically, and a free sandbox tester account can mint them without
  # limit — accepting them means anyone can credit themselves unbounded coins they never bought.
  # Turn on only against a non-production deployment. Env: AICOIN_PROXY_IAP_ACCEPT_SANDBOX.
  acceptSandboxPurchases: false
  packages:
    - { productId: com.tarasmaslov.infiniteairadio.aicoin.small,       coins: 50,   usdPriceHint: 0.99 }
    - { productId: com.tarasmaslov.infiniteairadio.aicoin.medium,      coins: 200,  usdPriceHint: 2.99 }
    - { productId: com.tarasmaslov.infiniteairadio.aicoin.large,       coins: 1000, usdPriceHint: 9.99 }
    - { productId: com.tarasmaslov.infiniteairadio.aicoin.xl,          coins: 5000, usdPriceHint: 44.99 }
    - { productId: com.tarasmaslov.alllanguageslearner.aicoin.small,   coins: 50,   usdPriceHint: 0.99 }
    - { productId: com.tarasmaslov.alllanguageslearner.aicoin.medium,  coins: 200,  usdPriceHint: 2.99 }
    - { productId: com.tarasmaslov.alllanguageslearner.aicoin.large,   coins: 1000, usdPriceHint: 9.99 }
    - { productId: com.tarasmaslov.alllanguageslearner.aicoin.xl,      coins: 5000, usdPriceHint: 44.99 }
    - { productId: com.tarasmaslov.learnit.aicoin.small,               coins: 50,   usdPriceHint: 0.99 }
    - { productId: com.tarasmaslov.learnit.aicoin.medium,              coins: 200,  usdPriceHint: 2.99 }
    - { productId: com.tarasmaslov.learnit.aicoin.large,               coins: 1000, usdPriceHint: 9.99 }
    - { productId: com.tarasmaslov.learnit.aicoin.xl,                  coins: 5000, usdPriceHint: 44.99 }
