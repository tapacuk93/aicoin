server:
  port: 8080
redis:
  host: localhost
  port: 6379
  username: ""
  password: ""
  ssl: false
aicoin:
  decayHalflifeDays: 110.0
  freeClaimCooldownSeconds: 3600
  signatureSkewSeconds: 120
  freeCoinsPoolSize: 5000
  adminToken: ""
# allowedPaths: the only endpoints the generic X-AI route forwards for a provider; anything else
# is answered 403 before a coin is held or the provider is contacted. Every wallet's call goes out
# under the proxy's one key per provider, so whatever a provider stores for its customer (files,
# batches, stored responses, caches, history, voices) would be shared by every wallet — readable and
# deletable by all of them. So this lists stateless generation and model listings only; add an
# endpoint here only once it is certain the provider keeps nothing from it that another caller
# could read back. Syntax: "METHOD path-glob", where * is one path segment (or part of one) and **
# crosses segments. OpenAI POST /v1/responses is additionally forced to store:false, and ElevenLabs
# voices are scoped to the wallet that designed them (see AllowedTargets and VoiceOwnership).
# Env: AICOIN_PROXY_<PROVIDER>_ALLOWEDPATHS (comma-separated; "none" forwards nothing).
#
# freePaths: endpoints the provider does not bill the proxy for. A matching call is
# forwarded (with the proxy's key, after the usual token auth) but costs no aicoin and
# records no price event. Syntax: "[METHOD ]path-glob", where * matches any characters.
providers:
  openai:
    baseUrl: https://api.openai.com
    apiKey: ""
    authHeader: Authorization
    authPrefix: "Bearer "
    freePaths: ["GET /v1/models", "GET /v1/models/*"]
    allowedPaths: ["POST /v1/chat/completions", "POST /v1/completions", "POST /v1/responses",
                   "POST /v1/responses/input_tokens", "POST /v1/embeddings", "POST /v1/moderations",
                   "POST /v1/audio/speech", "POST /v1/audio/transcriptions", "POST /v1/audio/translations",
                   "POST /v1/images/generations", "POST /v1/images/edits", "POST /v1/images/variations",
                   "GET /v1/models", "GET /v1/models/*"]
    probePath: /v1/models
  anthropic:
    baseUrl: https://api.anthropic.com
    apiKey: ""
    authHeader: x-api-key
    authPrefix: ""
    freePaths: ["GET /v1/models", "GET /v1/models/*", "POST /v1/messages/count_tokens"]
    allowedPaths: ["POST /v1/messages", "POST /v1/messages/count_tokens", "GET /v1/models", "GET /v1/models/*"]
    probePath: /v1/models
  google:
    baseUrl: https://generativelanguage.googleapis.com
    apiKey: ""
    authAsQueryParam: true
    authQueryParamName: key
    freePaths: ["GET /v1/models", "GET /v1/models/*", "GET /v1beta/models", "GET /v1beta/models/*",
                "POST /v1/models/*:countTokens", "POST /v1beta/models/*:countTokens"]
    allowedPaths: ["POST /v1/models/*:generateContent", "POST /v1beta/models/*:generateContent",
                   "POST /v1/models/*:streamGenerateContent", "POST /v1beta/models/*:streamGenerateContent",
                   "POST /v1/models/*:countTokens", "POST /v1beta/models/*:countTokens",
                   "POST /v1/models/*:embedContent", "POST /v1beta/models/*:embedContent",
                   "POST /v1/models/*:batchEmbedContents", "POST /v1beta/models/*:batchEmbedContents",
                   "POST /v1beta/models/*:predict",
                   "GET /v1/models", "GET /v1/models/*", "GET /v1beta/models", "GET /v1beta/models/*"]
    probePath: /v1/models
  mistral:
    baseUrl: https://api.mistral.ai
    apiKey: ""
    authHeader: Authorization
    authPrefix: "Bearer "
    freePaths: ["GET /v1/models", "GET /v1/models/*"]
    allowedPaths: ["POST /v1/chat/completions", "POST /v1/fim/completions", "POST /v1/embeddings",
                   "POST /v1/moderations", "POST /v1/chat/moderations", "GET /v1/models", "GET /v1/models/*"]
    probePath: /v1/models
  cohere:
    baseUrl: https://api.cohere.ai
    apiKey: ""
    authHeader: Authorization
    authPrefix: "Bearer "
    freePaths: ["GET /v1/models", "GET /v1/models/*", "POST /v1/tokenize", "POST /v1/detokenize",
                "POST /v1/check-api-key"]
    allowedPaths: ["POST /v1/chat", "POST /v2/chat", "POST /v1/generate", "POST /v1/embed", "POST /v2/embed",
                   "POST /v1/rerank", "POST /v2/rerank", "POST /v1/classify",
                   "POST /v1/tokenize", "POST /v1/detokenize", "POST /v1/check-api-key",
                   "GET /v1/models", "GET /v1/models/*"]
    probePath: /v1/models
  elevenlabs:
    baseUrl: https://api.elevenlabs.io
    apiKey: ""
    authHeader: xi-api-key
    authPrefix: ""
    freePaths: ["GET /v1/models", "GET /v1/voices", "GET /v1/voices/*", "GET /v1/user", "GET /v1/user/subscription"]
    allowedPaths: ["POST /v1/text-to-speech/*", "POST /v1/text-to-speech/*/stream",
                   "POST /v1/text-to-speech/*/with-timestamps", "POST /v1/text-to-speech/*/stream/with-timestamps",
                   "POST /v1/sound-generation", "POST /v1/music", "POST /v1/music/stream",
                   "POST /v1/text-to-voice/create-previews", "POST /v1/text-to-voice",
                   "POST /v1/text-to-voice/create-voice-from-preview", "DELETE /v1/voices/*",
                   "GET /v1/voices", "GET /v1/models"]
    # Not /v1/models: a key scoped without models_read is refused there while still being able to
    # synthesize speech, and the liveness probe would report a working backend as down.
    probePath: /v1/voices
  stability:
    baseUrl: https://api.stability.ai
    apiKey: ""
    authHeader: Authorization
    authPrefix: "Bearer "
    freePaths: ["GET /v1/engines/list", "GET /v1/user/account", "GET /v1/user/balance"]
    allowedPaths: ["POST /v1/generation/*/text-to-image", "POST /v1/generation/*/image-to-image",
                   "POST /v2beta/stable-image/generate/core", "POST /v2beta/stable-image/generate/sd3",
                   "POST /v2beta/stable-image/generate/ultra", "GET /v1/engines/list"]
    probePath: /v1/engines/list
  # Moonshot's Kimi, spoken to on its OpenAI-compatible surface. api.moonshot.ai is still the
  # API host even though the platform docs now live at kimi.ai.
  kimi:
    baseUrl: https://api.moonshot.ai
    apiKey: ""
    authHeader: Authorization
    authPrefix: "Bearer "
    freePaths: ["GET /v1/models", "GET /v1/models/*"]
    allowedPaths: ["POST /v1/chat/completions", "POST /v1/tokenizers/estimate-token-count", "GET /v1/models", "GET /v1/models/*"]
    probePath: /v1/models
  # Google Cloud Text-to-Speech, for Malagasy. Not the `google` key: this API refuses API keys,
  # so it signs in as a service account — the key file Google's console downloads, by path.
  # Env: AICOIN_PROXY_GOOGLETTS_CREDENTIALS. Unset, the provider is simply unconfigured.
  googletts:
    baseUrl: https://texttospeech.googleapis.com
    apiKey: ""
    credentials: ""
    authHeader: Authorization
    authPrefix: "Bearer "
    freePaths: ["GET /v1/voices"]
    probePath: /v1/voices
pricing:
  # Charge each call what it actually cost, rounded up to whole coins with a floor of one,
  # instead of a flat coin per call. This is the billing model — the flag exists so it can be
  # turned OFF (per deployment, or for a test run) rather than as an opt-in.
  #
  # Turning it off again is a user-visible pricing change in the other direction: every client's
  # copy says a call costs "from 1 AICoin, more if it's a long one", so a deployment that flips
  # this to false is charging less than it says, not more. Harmless to users, but don't leave it
  # there by accident. Env: AICOIN_PROXY_METERED.
  metered: true
  # What one coin is worth when metering. Defaults to the per-coin price of the largest IAP pack
  # — the cheapest a coin is ever sold for — so metering against it never under-charges a bulk
  # buyer. Env: AICOIN_PROXY_COIN_VALUE_USD.
  coinValueUsd: 0.009
  # Fallbacks only, for a provider or model with no entry under `providers` below.
  costPerTokenUsd: 0.000002
  defaultCostUsdPerCall: 0.001
  # Per-provider, per-model list prices in USD per million tokens. One blended rate cannot be
  # right for more than one model at a time — Sonnet bills output at 5x its input rate, Haiku at
  # a third of Sonnet's, and speech and image APIs report no tokens at all. Nor can one rate fit
  # every client: input/output ratios differ sharply between chat, long-context, and generation
  # workloads, and this proxy serves all of them. Longest matching model prefix wins, then the
  # provider's own input/output rates, then `usdPerCall`, then the fallbacks above. Rates are
  # config, not code: correct them here when a provider reprices.
  providers:
    anthropic:
      inputUsdPerMillionTokens: 3.00
      outputUsdPerMillionTokens: 15.00
      models:
        # Sonnet 5 also has introductory pricing of 2.00/10.00 running to 2026-08-31; the standard
        # rate is used here deliberately, since under-recording cost is the failure this table
        # exists to prevent and the introductory rate lapses shortly.
        claude-sonnet-5:  { inputUsdPerMillionTokens: 3.00, outputUsdPerMillionTokens: 15.00 }
        claude-haiku-4-5: { inputUsdPerMillionTokens: 1.00, outputUsdPerMillionTokens: 5.00 }
        claude-opus-5:    { inputUsdPerMillionTokens: 5.00, outputUsdPerMillionTokens: 25.00 }
        # The consortium's `quality: "best"` Anthropic panelist; without this line it would match
        # claude-opus-5 above and be over-recorded by a quarter.
        claude-opus-5-5:  { inputUsdPerMillionTokens: 4.00, outputUsdPerMillionTokens: 20.00 }
    # Non-Anthropic rates below are unverified starting points — check each provider's own pricing
    # page and correct them here.
    openai:
      inputUsdPerMillionTokens: 2.50
      outputUsdPerMillionTokens: 10.00
      models:
        # The consortium's default OpenAI panelist. Named here because the provider default above
        # is dearer on input than GPT-5 actually is, and a rate this proxy gets wrong in either
        # direction ends up in GET /price.
        gpt-5: { inputUsdPerMillionTokens: 1.25, outputUsdPerMillionTokens: 10.00 }
        # The `quality: "best"` panelist (developers.openai.com/api/docs/pricing, 2026-10-26; input
        # over 272K tokens is 4.00 / 15.00, which no consortium turn reaches).
        gpt-6.1-sol: { inputUsdPerMillionTokens: 2.00, outputUsdPerMillionTokens: 10.00 }
        # Billed per image and per clip. Both are reached through POST /image and POST /audio,
        # whose responses report either no usage at all or a token count that has nothing to do
        # with the price — so a flat figure is the only honest one. Check and correct these when
        # OpenAI reprices; an image recorded at a tenth of its cost is published as the coin price.
        gpt-image-1:      { usdPerCall: 0.042 }
        gpt-image-1-mini: { usdPerCall: 0.015 }
        gpt-4o-mini-tts:  { usdPerCall: 0.015 }
    google:
      inputUsdPerMillionTokens: 0.30
      outputUsdPerMillionTokens: 2.50
      models:
        # The consortium's default Google panelist, at five times the provider default's input
        # rate. Without this line every consortium call through Gemini would be recorded at a
        # fraction of what it cost.
        gemini-3.5-flash: { inputUsdPerMillionTokens: 1.50, outputUsdPerMillionTokens: 9.00 }
        # The `quality: "best"` Google panelist. Listed at 2.00 / 10.00 until 2026-11-30 and 4.00 /
        # 20.00 from 2026-12-01 (ai.google.dev pricing); the later rate is used now, since
        # under-recording is the failure this table exists to prevent and the change is weeks away.
        gemini-4-argon: { inputUsdPerMillionTokens: 4.00, outputUsdPerMillionTokens: 20.00 }
        # Billed per image, not by the tokens the response happens to report. Left here as well as
        # in the built-in defaults so the figure can be corrected without a release when Google
        # moves it.
        gemini-2.5-flash-image: { usdPerCall: 0.039 }
        gemini-2.0-flash-preview-image-generation: { usdPerCall: 0.039 }
        # Speech, reached through POST /audio with provider "google" and priced by the audio tokens
        # it reports (25 a second). Google doubles these on 2027-01-01, to 1.00 / 18.00.
        gemini-3.8-flash-tts: { inputUsdPerMillionTokens: 0.50, outputUsdPerMillionTokens: 9.00 }
    # Kimi K2.6 and K2.7 Code share a rate; the high-speed K2.7 Code doubles the output rate, and
    # its longer id wins the prefix match. The provider default is K3's rate — the dearest — so an
    # unlisted model is over-recorded rather than under-recorded.
    kimi:
      inputUsdPerMillionTokens: 3.00
      outputUsdPerMillionTokens: 15.00
      models:
        kimi-k3:                    { inputUsdPerMillionTokens: 3.00, outputUsdPerMillionTokens: 15.00 }
        # K3.1 Pro is the `quality: "best"` panelist; its high-speed variant costs double, and its
        # longer id wins the prefix match (platform.kimi.ai pricing, 2026-10-26).
        kimi-k3.1-pro-highspeed:    { inputUsdPerMillionTokens: 4.00, outputUsdPerMillionTokens: 20.00 }
        kimi-k3.1-pro:              { inputUsdPerMillionTokens: 2.00, outputUsdPerMillionTokens: 10.00 }
        kimi-k2.7-code-highspeed:   { inputUsdPerMillionTokens: 0.95, outputUsdPerMillionTokens: 8.00 }
        kimi-k2.7-code:             { inputUsdPerMillionTokens: 0.95, outputUsdPerMillionTokens: 4.00 }
        kimi-k2.6:                  { inputUsdPerMillionTokens: 0.95, outputUsdPerMillionTokens: 4.00 }
    # Billed per character and per image respectively, and neither reports token usage, so both
    # get a flat per-call figure instead of token rates.
    elevenlabs:
      usdPerCall: 0.03
    stability:
      usdPerCall: 0.03
# One request answered by every configured AI at once, merged, then reviewed by all of them until
# a whole round comes back with no comments. See CONTRACT.md's "Consortium" section; every turn is
# an ordinary paid call, so the round cap is also a spend cap.
consortium:
  # Env: AICOIN_PROXY_CONSORTIUM_ENABLED. Off serves 404, as if the endpoint did not exist.
  enabled: true
  # The most review rounds one call may run before it returns what it has. Reviewers asked to find
  # fault can always find some, so this — not agreement — is what guarantees the call ends.
  # Env: AICOIN_PROXY_CONSORTIUM_MAX_ROUNDS.
  maxRounds: 3
  # Output cap per turn. Generous because the reasoning models on this panel spend part of it
  # thinking, and a turn that runs out mid-thought comes back with no text at all.
  # Env: AICOIN_PROXY_CONSORTIUM_MAX_OUTPUT_TOKENS.
  maxOutputTokens: 4000
  # The most a caller's `max_output_tokens` may raise that to; higher asks are clamped. A
  # chapter-length answer in HTML, from a model that thinks before it writes, does not fit in the
  # default and comes back cut off — paid for, then rejected. This bounds what one turn can cost.
  # Env: AICOIN_PROXY_CONSORTIUM_MAX_OUTPUT_TOKENS_CEILING.
  maxOutputTokensCeiling: 32000
  # How long one turn may go without the provider sending a byte. Turns are not streamed, so a
  # provider says nothing until the whole answer is written, and a long answer from a thinking
  # model takes minutes; upstream.readTimeoutSeconds (60) abandoned every one of those just before
  # it arrived. Env: AICOIN_PROXY_CONSORTIUM_TURN_READ_TIMEOUT_SECONDS.
  turnReadTimeoutSeconds: 600
  # A `library` (the larger work a request belongs to — see CONTRACT.md): most characters of text
  # in total, and most entries. Over either is a 400. Only its index goes into the record; text
  # comes in only when a panelist asks for it with READ <ref>.
  # Env: AICOIN_PROXY_CONSORTIUM_MAX_LIBRARY_CHARS, _MAX_LIBRARY_ENTRIES.
  maxLibraryChars: 600000
  maxLibraryEntries: 2000
  # How many READ requests one turn may make before it is told reading is closed (each re-runs the
  # turn, and each re-run is a paid call), and how many parts one call may add to the record in all.
  # Env: AICOIN_PROXY_CONSORTIUM_MAX_READS_PER_TURN, _MAX_LIBRARY_READS.
  maxReadsPerTurn: 3
  maxLibraryReads: 20
  # A call sent with a call_id is durable (CONTRACT.md "Durable calls"): it runs to its end without
  # a client, is checkpointed to Redis after every turn, and is resumed by another process if the
  # one running it dies. Kept this long for a client to come back for.
  # Env: AICOIN_PROXY_CONSORTIUM_CALL_RETENTION_HOURS.
  callRetentionHours: 24
  # How long a process's claim on a running call lasts unrenewed; after it a dead owner's calls
  # are resumed elsewhere. Env: AICOIN_PROXY_CONSORTIUM_CALL_LEASE_SECONDS.
  callLeaseSeconds: 30
  # A call paused by its caller (POST /consortium/{call_id}/pause) is kept this long to be resumed,
  # then deleted; its id answers 410 for a week after. Env: AICOIN_PROXY_CONSORTIUM_PAUSED_RETENTION_HOURS.
  pausedRetentionHours: 24
  # How much of the panel's shared record one turn may be given. Every panelist sees the record on
  # every turn, so this is multiplied by the panel size and by the rounds, and every character is
  # billed as input. Past it the oldest rounds are dropped; the request, the caller's background and
  # the current answer never are. Env: AICOIN_PROXY_CONSORTIUM_MAX_CONTEXT_CHARS.
  maxContextChars: 60000
  # Above this much caller-supplied context, `mode: auto` stops drafting in parallel and runs the
  # call led by one model, with the rest improving its answer round by round. Several models
  # answering the same short question independently disagree in useful ways and the merge is where
  # that pays off; once a directory or a document comes with the request, every draft is mostly a
  # re-reading of the same material, billed once per panelist, and they converge anyway because the
  # context is doing the work. Env: AICOIN_PROXY_CONSORTIUM_LEAD_CONTEXT_CHARS.
  leadContextChars: 8000
  # Who merges the drafts and applies the comments. Empty means the first panelist.
  # Env: AICOIN_PROXY_CONSORTIUM_EDITOR.
  editor: ""
  # What each panelist answers with. Config, not code: providers rename and retire models on their
  # own schedule, and a consortium that 400s because an id lapsed should be a restart away from
  # working. Each may be one id or a list tried in order within a turn when a model fails (see
  # bestModels.kimi). Env: AICOIN_PROXY_CONSORTIUM_<PROVIDER>_MODEL, a list comma-separated.
  models:
    anthropic: claude-sonnet-5
    openai: gpt-5
    google: gemini-3.5-flash
    mistral: mistral-large-latest
    kimi: kimi-k2.6
  # What each panelist answers with on a `quality: "best"` call: the strongest text model each
  # provider listed on 2026-10-26, every id taken from that provider's own models API and confirmed
  # with a one-line generation — except where the comment says otherwise. A provider with no entry
  # keeps its model above, so leaving one out costs strength, never a seat.
  # Env: AICOIN_PROXY_CONSORTIUM_<PROVIDER>_BEST_MODEL (a list comma-separated).
  bestModels:
    anthropic: claude-opus-5-5
    # Newest flagship-tier ("sol") model listed. Listed but NOT confirmed by a generation: the
    # OpenAI account had no credits left on 2026-10-26 (429 credit_balance_exhausted on every model).
    openai: gpt-6.1-sol
    google: gemini-4-argon
    # A list is tried in order within one turn when a model fails (overloaded, 429, 5xx, timeout,
    # no text). K3.1 Pro high-speed is the fast one but refused 5 tries in 5 as
    # engine_overloaded_error on 2026-10-26; plain K3.1 Pro answers, slowly (95 s for a paragraph).
    kimi: [kimi-k3.1-pro-highspeed, kimi-k3.1-pro]
    # mistral: none. No Mistral key exists locally or in production to list its models with.
# The consolidated endpoints: POST /text, POST /image, POST /audio. One shape in, one shape out,
# with the provider chosen here from the ratings below rather than named by the caller. See
# CONTRACT.md's "Capability endpoints" section.
capabilities:
  text:
    # Whether a single model answering POST /text may hand the request to the whole panel by
    # replying with NEEDS CONSORTIUM. It costs the caller several times one call, so a deployment
    # that wants a predictable per-request price turns this off and every /text call is exactly
    # one call. Env: AICOIN_PROXY_CAPABILITIES_ESCALATION_ENABLED.
    escalation: true
  image:
    models:
      openai: gpt-image-1-mini                       # AICOIN_PROXY_OPENAI_IMAGE_MODEL
      stability: stable-diffusion-xl-1024-v1-0       # AICOIN_PROXY_STABILITY_IMAGE_MODEL
  audio:
    models:
      elevenlabs: eleven_multilingual_v2             # AICOIN_PROXY_ELEVENLABS_AUDIO_MODEL
      openai: gpt-4o-mini-tts                        # AICOIN_PROXY_OPENAI_AUDIO_MODEL
      google: gemini-3.8-flash-tts                   # AICOIN_PROXY_GOOGLE_AUDIO_MODEL
      googletts: gemini-3.1-flash-tts-preview        # AICOIN_PROXY_GOOGLETTS_AUDIO_MODEL
    voices:
      # A stock ElevenLabs voice every account has, and OpenAI's default. Either can be overridden
      # per request with "voice". Env: AICOIN_PROXY_<PROVIDER>_VOICE.
      elevenlabs: EXAVITQu4vr4xnSDxMaL
      openai: alloy
      google: Kore
      googletts: Kore
  # What each provider is rated at, 0-5. A capability rating of 0 means never route: it is how
  # "this provider does not do that" is said. Subject ratings override the capability rating for
  # requests tagged with that subject; a subject with no entry means no opinion, not a bad score.
  #
  # These are the operator's opinion. Nothing here is benchmarked and nothing is learned from
  # traffic — they are one reading of which model to reach for, and they will be wrong for
  # somebody's workload. Edit them; a caller who disagrees names a provider explicitly and is not
  # routed at all. Subjects: code, math, translation, writing, creative, analysis, science, legal,
  # general. A bare subject key rates the provider's text; a media capability takes a prefixed one
  # (image-creative, audio-creative). Env: AICOIN_PROXY_SKILL_<PROVIDER>_<KEY>, e.g.
  # AICOIN_PROXY_SKILL_OPENAI_CODE=4 or AICOIN_PROXY_SKILL_STABILITY_IMAGE_CREATIVE=3.
  skills:
    anthropic: { text: 5, code: 5, writing: 5, analysis: 5, legal: 4, creative: 4 }
    openai:    { text: 5, image: 5, audio: 4, code: 5, math: 5, science: 4, analysis: 4, creative: 4 }
    google:    { text: 4, audio: 3, science: 5, translation: 5, math: 4, analysis: 4, code: 3 }
    mistral:   { text: 3, translation: 4, code: 3, writing: 3 }
    kimi:      { text: 4, translation: 5, analysis: 4, code: 4, writing: 4 }
    # A media provider's subject rating is prefixed with the capability: being rated for writing
    # code says nothing about who should read a sentence about code aloud, and an unprefixed
    # rating decided exactly that.
    elevenlabs: { audio: 5, audio-creative: 5 }
    googletts: { audio: 2 }
    stability:  { image: 4, image-creative: 5 }
health:
  windowSize: 50
  # Liveness probing: one GET per provider per interval, to that provider's `probePath` above,
  # with the proxy's own key attached. This is what lets GET /health say whether a backend is
  # there at all — the window above only reports on calls that happened to be made, so a provider
  # nobody has called reads as healthy right up until the first customer call fails on it.
  #
  # The probe paths are free endpoints (they appear in each provider's freePaths), so this costs
  # nothing however long it runs. Env: AICOIN_PROXY_HEALTH_PROBE_ENABLED,
  # AICOIN_PROXY_HEALTH_PROBE_INTERVAL_SECONDS, AICOIN_PROXY_HEALTH_PROBE_TIMEOUT_SECONDS.
  probe:
    enabled: true
    intervalSeconds: 60
    timeoutSeconds: 10
upstream:
  # How long a provider connection may deliver nothing before the forward is abandoned as a 504
  # and the call's coins are refunded. The connect timeout covers only establishing the socket, so
  # without this a provider that accepted and then stalled was waited on indefinitely — the
  # client's own timeout was the only limit anywhere, and it left this side holding the socket, the
  # buffered response and an unrefunded debit. Generous enough for a long speech synthesis or a
  # large completion, far below the point where any client is still listening.
  # Env: AICOIN_PROXY_UPSTREAM_READ_TIMEOUT_SECONDS.
  readTimeoutSeconds: 60
accessLog:
  # One JSON line per request: method, path (no query — see AccessLog on why credentials are never
  # written), provider, wallet address, status, byte counts, duration, coins charged, outcome.
  # A client that gives up and disconnects before any response is recorded as status -1 /
  # "client_gone", which is the only trace such a request leaves anywhere.
  # Empty path turns access logging off. Env: AICOIN_PROXY_ACCESS_LOG_PATH.
  path: logs/access.log
  # Rotation is by size: maxBytes per file, count files kept, oldest overwritten. maxBytes × count
  # is a hard ceiling on disk used — this shares a 20GB Lightsail volume with Redis snapshots, so
  # the default deliberately caps the whole log at 50MB.
  # Env: AICOIN_PROXY_ACCESS_LOG_MAX_BYTES / AICOIN_PROXY_ACCESS_LOG_COUNT.
  maxBytes: 10485760
  count: 5
anyphone:
  # Hosted Anyphone: an Android phone on an EC2 instance in the operator's AWS account, paid by
  # the minute in aicoin (GET /phone/price, POST /phone/start, GET /phone/status,
  # POST /phone/suspend; see CONTRACT.md "Hosted Anyphone"). Off by default: while false the
  # endpoints answer 404, no AWS client is built and no meter runs. Env: AICOIN_PROXY_ANYPHONE_ENABLED.
  # Turning it off while phones run leaves their instances running unmetered: suspend them first.
  enabled: false
  # Where phones are launched. The subnet must give a public IPv4 route to the internet; the
  # security group must allow inbound 443/tcp only (anyphoned: TLS + token) and all outbound.
  # No instance profile: a hosted phone calls no AWS API.
  # Env: AICOIN_PROXY_ANYPHONE_REGION / _SUBNET_ID / _SECURITY_GROUP_ID.
  region: us-east-1
  subnetId: ""
  securityGroupId: ""
  # The image: with bakedAmi, the newest available self-owned image tagged anyphone:baked=1,
  # anyphone:version=<version>, anyphone:gpu=<tier imageGpu> (anyphone's bake-ami.sh), looked up
  # at most every 10 minutes; amiId (or a tier's own amiId) when there is none.
  # Env: _BAKED_AMI / _AMI_ID.
  bakedAmi: true
  amiId: ""
  # Root /dev/sda1: gp3, encrypted, deleted with the instance, never below 40 GB. Env: _ROOT_VOLUME_GB.
  rootVolumeGb: 40
  # REQUIRED. ANYPHONE_VERSION: the anyphone release to run (releases/<version>/ must exist at
  # releaseUrl). Env: _VERSION.
  version: ""
  # REQUIRED. ANYPHONE_REPO: https base URL of the anyphone releases (the release bucket's
  # releases/ prefix). The user-data script's built-in default (anyphone-cfn-k7q2m9) was deleted
  # on 2026-10-26, so this has no default. Env: _RELEASE_URL.
  releaseUrl: ""
  # The user data: empty uses the bundled src/main/resources/anyphone/hosted-user-data.sh (a copy
  # of anyphone's infra/aws/hosted-user-data.sh); a path uses that file instead. Env: _USER_DATA_TEMPLATE.
  userDataTemplate: ""
  # The Anyphone app's bundle id: low-balance warnings are pushed to the wallet's devices that
  # registered (POST /push/devices) under this topic.
  pushTopic: com.oeaio.anyphone
  # Price per minute = ceil(usdPerHour / 60 * (1 + feeMargin) / (1 - 0.30 Apple cut) / coinValueUsd).
  # coinValueUsd defaults to pricing.coinValueUsd and feeMargin to the IAP repricer's 0.50.
  # feeMargin: 0.5
  # coinValueUsd: 0.009
  # Starting needs a balance covering this many minutes.
  minimumMinutes: 10
  # Push "running low" when the balance covers fewer minutes than this. Early enough to save the
  # phone: the app downloads its whole state (several GB) before suspending.
  warnMinutes: 15
  # Once the balance cannot pay the next minute, the phone keeps running this long (charged, into
  # debt) so the app can back it up or the user can top up; then it is terminated without a backup.
  # Long enough for that download on a slow connection.
  graceSeconds: 600
  # How often the meter charges, follows instance state and reaps orphans.
  meterIntervalSeconds: 15
  # A phone whose launch was never recorded is dropped after this long.
  startTimeoutSeconds: 300
  tiers:
    # usdPerHour is what an hour costs the operator — on-demand list price, or for market: spot the
    # most it will pay (sent as the spot max price). imageGpu is the anyphone:gpu tag of its baked
    # image. Env per tier: AICOIN_PROXY_ANYPHONE_GPU_AVAILABLE, _GPU_INSTANCE_TYPE,
    # _GPU_USD_PER_HOUR, _GPU_MARKET, _GPU_AMI_ID, _GPU_IMAGE_GPU, _GPU_NESTED_VIRTUALIZATION.
    gpu:
      instanceType: g4dn.metal
      usdPerHour: 7.82
      market: on-demand
      # False until the account's GPU vCPU quota allows a g4dn.metal.
      available: false
      imageGpu: nvidia
      # Metal: no nested-virtualization option.
      nestedVirtualization: false
    cpu:
      instanceType: c8i.2xlarge
      usdPerHour: 0.38
      market: on-demand
      available: true
      imageGpu: none
      # The emulator needs KVM inside the VM.
      nestedVirtualization: true
iap:
  # Whether POST /wallet/api/redeem-iap honours StoreKit *Sandbox* transactions. Production must
  # leave this false: Apple signs sandbox transactions with the same certificate chain as real
  # ones, so they verify identically, and a free sandbox tester account can mint them without
  # limit — accepting them means anyone can credit themselves unbounded coins they never bought.
  # Turn on only against a non-production deployment. Env: AICOIN_PROXY_IAP_ACCEPT_SANDBOX.
  acceptSandboxPurchases: false
  packages:
    - { productId: com.tarasmaslov.infiniteairadio.aicoin.small,       coins: 50,   usdPriceHint: 0.99 }
    - { productId: com.tarasmaslov.infiniteairadio.aicoin.medium,      coins: 200,  usdPriceHint: 2.99 }
