    - { productId: com.tarasmaslov.alllanguageslearner.aicoin.medium,  coins: 200,  usdPriceHint: 2.99 }
    - { productId: com.tarasmaslov.alllanguageslearner.aicoin.large,   coins: 1000, usdPriceHint: 9.99 }
    - { productId: com.tarasmaslov.alllanguageslearner.aicoin.xl,      coins: 5000, usdPriceHint: 44.99 }
    # All AI Learn (formerly Learn Its): its products keep the old learnit prefix.
    - { productId: com.tarasmaslov.learnit.aicoin.small,               coins: 50,   usdPriceHint: 0.99 }
    - { productId: com.tarasmaslov.learnit.aicoin.medium,              coins: 200,  usdPriceHint: 2.99 }
    - { productId: com.tarasmaslov.learnit.aicoin.large,               coins: 1000, usdPriceHint: 9.99 }
    - { productId: com.tarasmaslov.learnit.aicoin.xl,                  coins: 5000, usdPriceHint: 44.99 }
    - { productId: com.oeaio.infiniteaibook.aicoin.small,              coins: 50,   usdPriceHint: 0.99 }
    - { productId: com.oeaio.infiniteaibook.aicoin.medium,             coins: 200,  usdPriceHint: 1.99 }
    - { productId: com.oeaio.infiniteaibook.aicoin.large,              coins: 1000, usdPriceHint: 9.99 }
    - { productId: com.oeaio.infiniteaibook.aicoin.xl,                 coins: 5000, usdPriceHint: 24.99 }
    # Anyphone (rented phones by the minute). Its four products are not in App Store Connect yet.
    - { productId: com.oeaio.anyphone.aicoin.small,                    coins: 50,   usdPriceHint: 0.99 }
    - { productId: com.oeaio.anyphone.aicoin.medium,                   coins: 200,  usdPriceHint: 1.99 }
